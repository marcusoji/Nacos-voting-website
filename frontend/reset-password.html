<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — NACOS Awards 2026</title>
  <link rel="stylesheet" href="style/main.css">
</head>
<body>
<div class="page-wrap">
  <div class="form-page">
    <div class="form-card">
      <h1 class="form-title" style="margin-bottom:.4rem;">New Password</h1>
      <p class="form-subtitle">Choose a strong password for your account.</p>

      <div id="form-wrap">
        <form onsubmit="handleReset(event)">
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" id="rp-pass" class="form-control" required placeholder="Min 8 characters" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="rp-confirm" class="form-control" required placeholder="Repeat password" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="rp-btn">Update Password</button>
        </form>
      </div>

      <div id="invalid-wrap" style="display:none; text-align:center; padding:1.5rem 0;">
        <div style="font-size:3rem; margin-bottom:1rem;">⚠️</div>
        <div style="font-weight:700; font-size:1.1rem; margin-bottom:.5rem; color:var(--danger, #e53e3e);">Invalid or Expired Link</div>
        <p style="color:var(--text-sub); font-size:.88rem; line-height:1.6;">
          This password reset link is invalid or has expired.<br>Please request a new one.
        </p>
        <a href="forgot-password.html" class="btn btn-primary" style="display:inline-block;margin-top:1rem;">Request New Link</a>
      </div>

      <div class="form-link-row" style="margin-top:1.25rem;">
        <a href="login.html">← Back to Login</a>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  // Supabase embeds the recovery token in the URL *hash* (not query string):
  // https://yourapp.com/reset-password.html#access_token=XXX&type=recovery
  // We parse it here before the page finishes loading.
  (function checkToken() {
    const hash   = window.location.hash.substring(1); // strip leading '#'
    const params = new URLSearchParams(hash);
    const type   = params.get('type');
    const token  = params.get('access_token');

    if (!token || type !== 'recovery') {
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('form-wrap').style.display    = 'none';
        document.getElementById('invalid-wrap').style.display = 'block';
      });
    }
  })();

  async function handleReset(e) {
    e.preventDefault();
    const btn     = document.getElementById('rp-btn');
    const hash    = window.location.hash.substring(1);
    const params  = new URLSearchParams(hash);
    const token   = params.get('access_token');
    const pass    = document.getElementById('rp-pass').value;
    const confirm = document.getElementById('rp-confirm').value;

    if (!token) {
      Toast.error('Invalid Link', 'This reset link is invalid or expired.');
      return;
    }
    if (pass !== confirm)  { Toast.error('Mismatch',   'Passwords do not match.'); return; }
    if (pass.length < 8)   { Toast.error('Too short',  'Password must be at least 8 characters.'); return; }

    setLoading(btn, true);
    try {
      const r = await apiFetch('/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({ access_token: token, newPassword: pass })
      });
      if (r.ok) {
        Toast.success('Password Updated!', 'You can now log in with your new password.');
        setTimeout(() => window.location.href = 'login.html', 1800);
      } else {
        Toast.error('Failed', r.data?.message || 'Reset link may have expired.');
        setLoading(btn, false, 'Update Password');
      }
    } catch (err) {
      Toast.error('Error', 'Network error. Please try again.');
      setLoading(btn, false, 'Update Password');
    }
  }
</script>
</body>
</html>
