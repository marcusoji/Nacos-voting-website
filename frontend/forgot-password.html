<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — NACOS Awards 2026</title>
  <link rel="stylesheet" href="style/main.css">
</head>
<body>
<div class="page-wrap">
  <div class="form-page">
    <div class="form-card">
      <div class="form-logo-row">
        <img src="assets/delsu-logo.png" alt="DELSU" onerror="this.style.display='none'">
        <div class="logo-divider"></div>
        <img src="assets/nacos-logo.png" alt="NACOS" onerror="this.style.display='none'">
      </div>
      <h1 class="form-title">Reset Password</h1>
      <p class="form-subtitle">Enter your registered email and we'll send you a reset link.</p>

      <div id="form-wrap">
        <form onsubmit="handleForgot(event)">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="fp-email" class="form-control" required placeholder="your@email.com" autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="fp-btn">Send Reset Link</button>
        </form>
      </div>

      <div id="success-wrap" style="display:none; text-align:center; padding:1.5rem 0;">
        <div style="font-size:3rem; margin-bottom:1rem;">📬</div>
        <div style="font-weight:700; font-size:1.1rem; margin-bottom:.5rem;">Email Sent!</div>
        <p style="color:var(--text-sub); font-size:.88rem; line-height:1.6;">
          If an account exists for that email, a reset link has been sent. Check your inbox (and spam folder).
        </p>
      </div>

      <div class="form-link-row" style="margin-top:1.25rem;">
        <a href="login.html">← Back to Login</a>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
async function handleForgot(e) {
  e.preventDefault();
  const btn = document.getElementById('fp-btn');
  setLoading(btn, true);
  try {
    const r = await apiFetch('/auth/forgot-password', {
      method: 'POST',
      body: JSON.stringify({ email: document.getElementById('fp-email').value.trim() })
    });
    document.getElementById('form-wrap').style.display = 'none';
    document.getElementById('success-wrap').style.display = 'block';
  } catch(err) {
    Toast.error('Error', 'Network error. Please try again.');
    setLoading(btn, false, 'Send Reset Link');
  }
}
</script>
</body>
</html>
