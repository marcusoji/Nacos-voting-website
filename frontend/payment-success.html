<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment — NACOS Awards 2026</title>
  <link rel="stylesheet" href="style/main.css">
</head>
<body>
<div class="page-wrap">
  <div class="success-page">
    <div class="success-card" id="success-card">

      <div id="s-icon" class="success-icon wait" style="margin:0 auto 1.25rem;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>

      <h1 class="success-title" id="s-title">Verifying Payment&#8230;</h1>
      <p  class="success-msg"   id="s-msg">Please wait while we confirm your transaction.</p>
      <div id="s-extra"></div>

    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
/* ---------- icon helpers ---------- */
const ICONS = {
  ok  : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  err : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  wait: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`
};

function setIcon(type) {
  const el = document.getElementById('s-icon');
  el.className  = `success-icon ${type}`;
  el.innerHTML  = ICONS[type] || ICONS.wait;
}
function setTitle(t) { document.getElementById('s-title').textContent = t; }
function setMsg(m)   { document.getElementById('s-msg').innerHTML    = m; }
function setExtra(h) { document.getElementById('s-extra').innerHTML  = h; }

function actionBtns(ref) {
  return `
    <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1.25rem;">
      <a href="leaderboard.html" class="btn btn-primary">View Standings</a>
      <a href="categories.html"  class="btn btn-outline">Vote Again</a>
    </div>`;
}

function refBadge(ref) {
  return `<div class="success-ref" style="margin-top:.9rem;">Ref: ${ref}</div>`;
}

/* ---------- main verify logic ---------- */
let attempts = 0;
const MAX    = 5;
const DELAY  = 4000;

// Detect batch vs single reference
function isBatchRef(ref) { return ref && ref.toUpperCase().startsWith('BT-'); }

async function verify() {
  const params = new URLSearchParams(location.search);

  // ── Cancel detection ─────────────────────────────────────
  // Paystack sends ?cancelled=true when user clicks "Cancel & Go Back"
 const isCancelled =
  params.get('cancelled') === 'true' ||
  params.get('status') === 'cancelled' ||
  params.get('status') === 'failed';
  const storedRef   = sessionStorage.getItem('nacos_pending_ref') || sessionStorage.getItem('nacos_batch_ref');

  if (isCancelled) {
    const cancelRef = params.get('reference') || params.get('trxref') || storedRef;
    sessionStorage.removeItem('nacos_pending_ref');
    sessionStorage.removeItem('nacos_batch_ref');
    // Tell backend to mark it cancelled so pending-guard unblocks
    if (cancelRef) {
      try { await apiFetch(`/voting/cancel/${cancelRef}`, { method: 'POST' }); } catch {}
    }
    setIcon('err');
    setTitle('Payment Cancelled');
    setMsg('You cancelled the payment. No charge was made. Your ballot is still saved — you can try again.');
    setExtra(`
      <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;">
        <a href="checkout.html"   class="btn btn-gold">Try Again</a>
        <a href="categories.html" class="btn btn-outline">Back to Voting</a>
      </div>`);
    return;
  }

  const ref =
    params.get('reference') ||
    params.get('trxref')    ||
    sessionStorage.getItem('nacos_batch_ref');
// If Paystack redirected back without a valid reference,
// assume payment was abandoned/cancelled.
if (!params.get('reference') && storedRef) {
  try {
    await apiFetch(`/voting/cancel/${storedRef}`, {
      method: 'POST'
    });
  } catch {}

  sessionStorage.removeItem('nacos_pending_ref');
  sessionStorage.removeItem('nacos_batch_ref');
}
  if (!ref) {
    setIcon('err');
    setTitle('No Reference Found');
    setMsg('Paystack did not return a transaction reference. If you paid, check your email for a receipt, or contact support.');
    setExtra(`
      <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;">
        <a href="leaderboard.html" class="btn btn-primary">Check Standings</a>
        <a href="categories.html"  class="btn btn-outline">Back to Voting</a>
      </div>`);
    return;
  }

  if (isBatchRef(ref)) {
    await verifyBatch(ref);
  } else {
    await verifySingle(ref);
  }
}

/* ---------- single payment verify (unchanged logic) ---------- */
async function verifySingle(ref) {
  attempts++;
  setMsg(attempts > 1
    ? `Retrying verification (attempt ${attempts}/${MAX})&#8230;`
    : 'Confirming with Paystack&#8230;');

  let r;
  try {
    r = await apiFetch(`/voting/verify/${ref}`);
  } catch (e) {
    r = { ok: false, status: 0, data: { message: 'Network error', networkError: true } };
  }

  if (r.ok && r.data.success) {
    setIcon('ok');
    setTitle('Votes Recorded!');
    setMsg(`Your <strong>${r.data.quantity || ''} vote(s)</strong> have been recorded. Thank you for participating!`);
    setExtra(refBadge(ref) + actionBtns(ref));
    if (r.data.contestantId) Cart.removeById(r.data.contestantId);
    else Cart.clear();
    return;
  }

  const netErr = r.data?.networkError || r.status === 503 || r.status === 0;
  if (netErr && attempts < MAX) {
    setMsg(`Payment gateway is slow to respond — retrying (${attempts}/${MAX})&#8230;`);
    setTimeout(() => verifySingle(ref), nextDelay());
    return;
  }

  if (r.status === 404 && attempts < MAX) {
    setMsg(`Payment processing — confirming (${attempts}/${MAX})&#8230;`);
    setTimeout(() => verifySingle(ref), nextDelay());
    return;
  }

  setIcon('err');
  if (r.status === 400) {
    setTitle('Payment Not Completed');
    setMsg(r.data.message || 'The payment did not go through. No charge was made.');
    setExtra(`
      ${refBadge(ref)}
      <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;">
        <a href="checkout.html"  class="btn btn-gold">Try Again</a>
        <a href="categories.html" class="btn btn-outline">Back to Voting</a>
      </div>`);
  } else {
    setTitle('Verification Pending');
    setMsg('We could not automatically confirm your payment right now. If money was deducted, your votes are most likely recorded. Check the leaderboard or try below.');
    setExtra(`
      ${refBadge(ref)}
      <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;">
        <a href="leaderboard.html" class="btn btn-primary">Check Standings</a>
        <button onclick="checkDbStatus('${ref}')" class="btn btn-gold">Check My Votes</button>
        <button onclick="resetAndRetry('${ref}')" class="btn btn-outline">Retry</button>
      </div>
      <p style="font-size:.75rem;color:var(--text-muted);margin-top:.75rem;">
        Still stuck? Email support quoting the reference above.
      </p>`);
  }
}

/* ---------- batch payment verify ---------- */
async function verifyBatch(ref) {
  attempts++;
  setMsg(attempts > 1
    ? `Retrying batch verification (attempt ${attempts}/${MAX})&#8230;`
    : 'Confirming your votes with Paystack&#8230;');

  let r;
  try {
    r = await apiFetch(`/voting/verify-batch/${ref}`);
  } catch (e) {
    r = { ok: false, status: 0, data: { message: 'Network error', networkError: true } };
  }

  if (r.ok && r.data.success) {
    setIcon('ok');
    setTitle('All Votes Recorded!');

    const items = r.data.items || [];
    const totalVotes = items.reduce((s, i) => s + (i.quantity || 0), 0);
    setMsg(`<strong>${totalVotes} vote(s)</strong> recorded across <strong>${items.length} nominee(s)</strong>. Thank you for participating!`);

    // Build per-item detail table
    const rows = items.map(i => `
      <tr>
        <td style="padding:.45rem .6rem;border-bottom:1px solid rgba(255,255,255,.07);">${i.contestantName || i.contestantId}</td>
        <td style="padding:.45rem .6rem;border-bottom:1px solid rgba(255,255,255,.07);text-align:center;">${i.quantity}</td>
        <td style="padding:.45rem .6rem;border-bottom:1px solid rgba(255,255,255,.07);text-align:center;">
          <span style="color:${i.status==='success'||i.status==='already_recorded'?'#4ade80':'#f87171'};">
            ${i.status==='success'||i.status==='already_recorded' ? '✓ Recorded' : '⚠ Check support'}
          </span>
        </td>
      </tr>`).join('');

    const table = `
      <div style="margin:1rem 0;overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="color:var(--gold);">
              <th style="padding:.45rem .6rem;text-align:left;border-bottom:1px solid var(--border-gold);">Nominee</th>
              <th style="padding:.45rem .6rem;text-align:center;border-bottom:1px solid var(--border-gold);">Votes</th>
              <th style="padding:.45rem .6rem;text-align:center;border-bottom:1px solid var(--border-gold);">Status</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;

   setExtra(table + refBadge(ref) + actionBtns(ref));

sessionStorage.removeItem('nacos_batch_ref');

Cart.clear();
return;
  }

  const netErr = r.data?.networkError || r.status === 503 || r.status === 0;
  if (netErr && attempts < MAX) {
    setMsg(`Payment gateway is slow to respond — retrying (${attempts}/${MAX})&#8230;`);
    setTimeout(() => verifyBatch(ref), nextDelay());
    return;
  }

  if (r.status === 404 && attempts < MAX) {
    setMsg(`Payment processing — confirming (${attempts}/${MAX})&#8230;`);
    setTimeout(() => verifyBatch(ref), nextDelay());
    return;
  }

  setIcon('err');
  if (r.status === 400) {
    setTitle('Payment Not Completed');
    setMsg(r.data.message || 'The payment did not go through. No charge was made.');
    setExtra(`
      ${refBadge(ref)}
      <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;">
        <a href="checkout.html"  class="btn btn-gold">Try Again</a>
        <a href="categories.html" class="btn btn-outline">Back to Voting</a>
      </div>`);
  } else {
    setTitle('Verification Pending');
    setMsg('We could not automatically confirm your payment. If money was deducted, your votes are most likely recorded. Check the leaderboard or retry below.');
    setExtra(`
      ${refBadge(ref)}
      <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;">
        <a href="leaderboard.html" class="btn btn-primary">Check Standings</a>
        <button onclick="resetAndRetry('${ref}')" class="btn btn-outline">Retry Now</button>
      </div>
      <p style="font-size:.75rem;color:var(--text-muted);margin-top:.75rem;">
        Still stuck? Email support quoting the reference above.
      </p>`);
  }
}

/* Check DB directly — bypasses Paystack, used when network is down */
async function checkDbStatus(ref) {
  setIcon('wait');
  setTitle('Checking…');
  setMsg('Checking vote record in database…');
  setExtra('');
  try {
    const r = await apiFetch(`/voting/status/${ref}`);
    if (r.ok && r.data.status === 'success') {
      setIcon('ok');
      setTitle('Votes Are Recorded!');
      setMsg(`Your ${r.data.quantity || ''} vote(s) were successfully credited. The payment gateway was slow to confirm, but your votes are in.`);
      setExtra(refBadge(ref) + actionBtns(ref));
      Cart.clear();
    } else if (r.ok && r.data.status === 'pending') {
      setTitle('Still Processing');
      setMsg('Your transaction is still pending. This usually means Paystack has not confirmed yet. Please wait a minute and check the leaderboard.');
      setExtra(`
        ${refBadge(ref)}
        <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;">
          <a href="leaderboard.html" class="btn btn-primary">Check Standings</a>
          <button onclick="resetAndRetry('${ref}')" class="btn btn-outline">Retry Paystack</button>
        </div>`);
    } else {
      setTitle('Not Found');
      setMsg(r.data?.message || 'Could not find this transaction. Contact support with your reference.');
      setExtra(refBadge(ref));
    }
  } catch {
    setTitle('Network Error');
    setMsg('Could not reach server. Please check your connection.');
    setExtra(`<button onclick="checkDbStatus('${ref}')" class="btn btn-outline" style="margin-top:1rem;">Try Again</button>`);
  }
}

function resetAndRetry(ref) {
  attempts = 0;
  setIcon('wait');
  setTitle('Retrying Verification&#8230;');
  setMsg('Please wait.');
  setExtra('');
  verify();
}

document.addEventListener('DOMContentLoaded', verify);
</script>
</body>
</html>
