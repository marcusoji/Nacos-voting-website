<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote — NACOS Awards 2026</title>
  <link rel="stylesheet" href="style/main.css">
</head>
<body>
<div class="page-wrap">
  <div class="container" style="padding-top:3rem;">
    <h1 class="section-title" style="margin-bottom:.4rem;">Award <span class="accent">Categories</span></h1>
    <p class="section-sub" style="margin-bottom:2.5rem;">Select a category to view nominees and cast your votes. &#8358;100 per vote.</p>

    <div class="cat-grid" id="cat-grid">
      <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted);">
        <div class="spinner" style="width:28px;height:28px;margin:0 auto 1rem;border-width:3px;"></div>
        Loading categories&#8230;
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
const CAT_ICONS = {
  'entrepreneur':   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>`,
  'freshman-male':  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
  'freshman-female':`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
  'creator-male':   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`,
  'creator-female': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`
};
const DEFAULT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M8.21 13.89L7 23l5-3 5 3-1.21-9.12"/></svg>`;

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const r = await apiFetch('/voting/categories');
    const grid = document.getElementById('cat-grid');
    if (r.ok && r.data.data && r.data.data.length) {
      grid.innerHTML = r.data.data.map(cat => `
        <a href="${cat.slug}.html" class="cat-card">
          <div class="cat-card-icon">${CAT_ICONS[cat.slug] || DEFAULT_ICON}</div>
          <div class="cat-name">${cat.name}</div>
          <div class="cat-desc">${cat.description || ''}</div>
          <div class="cat-arrow">View nominees &rarr;</div>
        </a>`).join('');
    } else {
      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">No categories available yet.</p>';
    }
  } catch(e) {
    document.getElementById('cat-grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--crimson);">Failed to load. Please refresh.</p>';
  }
});
</script>
</body>
</html>
